            (function () {
                var s = null;
                try {
                    s = localStorage.getItem("astrum-sky");
                } catch (e) {}
                if (s !== "night" && s !== "day") {
                    s = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "day" : "night";
                }
                document.documentElement.dataset.sky = s;
                var tc = document.querySelector('meta[name="theme-color"]');
                if (tc) tc.content = s === "night" ? "#010101" : "#fff7fd";

                bottom: 0 !important;
                right: 0 !important;

            }
            .modal {
                position: absolute !important;
                top: 0 !important;

            .map .marker.marker--player .player__yaw:after {

        <script>
            (function () {
                // Перехватываем fetch для отключения credentials: "include",
                // который LiveAtlas шлет по умолчанию. Без этого браузер строго
                // блокирует ответы с Access-Control-Allow-Origin: * по стандарту CORS.
                const originalFetch = window.fetch;
                window.fetch = function (resource, init) {
                    if (resource instanceof Request) {
                        if (resource.credentials === 'include') {
                            resource = new Request(resource, { credentials: 'same-origin' });
                        }
                    } else if (init && init.credentials === 'include') {
                        init = Object.assign({}, init, { credentials: 'same-origin' });
                    }
                    return originalFetch.call(this, resource, init);
                };

                const CF_ENDPOINT = 'https://map-cdn.astrums.pro/';
                const YC_ENDPOINT = 'https://d5dd70mord2ad3qsu46h.ccx97b51.apigw.yandexcloud.net/';

                async function startLiveAtlas() {
                    let activeEndpoint = CF_ENDPOINT;

                    // Быстрая проверка доступности Cloudflare CDN (таймаут 1.8 сек)
                    try {
                        const controller = new AbortController();
                        const timer = setTimeout(() => controller.abort(), 1800);
                        const res = await fetch(CF_ENDPOINT + 'tiles/settings.json', {
                            signal: controller.signal,
                            mode: 'cors'
                        });
                        clearTimeout(timer);
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                    } catch (e) {
                        console.warn('[ASTRUM Map] Cloudflare недоступен, переключаемся на резервный Yandex Gateway:', e);
                        activeEndpoint = YC_ENDPOINT;
                    }

                    // Конфигурация LiveAtlas
                    window.liveAtlasConfig = {
                        servers: {
                            squaremap: {
                                squaremap: activeEndpoint
                            }
                        },
                        messages: {
                            chatNoMessages: 'В чате нету сообщений...',
                            chatTitle: 'Чат',
                            chatLogin: 'Please login to send chat messages',
                            chatSend: 'Отправить',
                            chatPlaceholder: 'Type your chat message here...',
                            chatErrorUnknown: 'Unexpected error while sending chat message',
                            chatErrorDisabled: 'Чат выключен',
                            serversHeading: 'Сервера',
                            markersHeading: 'Маркеры',
                            markersSearchPlaceholder: 'Поиск маркеров...',
                            markersSkeleton: 'Маркеров не найдено',
                            markersSetSkeleton: 'Этот маркер пуст',
                            markersSearchSkeleton: 'Маркеров не найдено',
                            markersUnnamed: '(Безымянный маркер)',
                            worldsSkeleton: 'Карты не были настроены',
                            playersSkeleton: 'Нет игроков онлайн',
                            playersTitle: 'Нажмите, чтобы выровнять экран по игроку\nКликните дважды, чтобы отслеживать',
                            playersTitleHidden: 'Этот игрок в данный момент скрыт с карты\nКликните дважды, чтобы следить за игроком',
                            playersTitleOtherWorld: 'Этот игрок находится в другом мире.\nНажмите, чтобы выровнять экран по игроку',
                            playersSearchPlaceholder: 'Поиск игроков...',
                            playersSearchSkeleton: 'Игроков не найдено',
                            followingHeading: 'Отслеживаете',
                            followingUnfollow: 'Перестать отслеживать',
                            followingTitleUnfollow: 'Перестаньте отслеживать этого игрока',
                            followingHidden: 'Скрыт с карты',
                            linkTitle: 'Скопировать ссылку',
                            loadingTitle: 'Загрузка...',
                            locationRegion: 'Регион',
                            locationChunk: 'Чанк',
                            contextMenuCopyLink: 'Скопировать ссылку',
                            contextMenuCenterHere: 'Выровнять',
                            toggleTitle: 'Нажмите, чтобы переключить этот раздел',
                            mapTitle: 'Карта мира ASTRUM',
                            layersTitle: 'Слои',
                            copyToClipboardSuccess: 'Скопировано в буфер обмена',
                            copyToClipboardError: 'Не удается скопировать в буфер обмена',
                            closeTitle: 'Закрыть',
                            showMore: 'Показать больше'
                        },
                        ui: {
                            playersAboveMarkers: true,
                            playersSearch: true,
                            compactPlayerMarkers: false,
                            disableContextMenu: false,
                            disableMarkerUI: false,
                            customLoginUrl: null
                        },
                        version: 1
                    };

                    // Подключаем стили LiveAtlas
                    const linkCss = document.createElement('link');
                    linkCss.rel = 'stylesheet';
                    linkCss.href = activeEndpoint + 'live-atlas/assets/index.1de34b3a.css';
                    document.head.appendChild(linkCss);

                    // Предзагрузка вендора
                    const linkVendor = document.createElement('link');
                    linkVendor.rel = 'modulepreload';
                    linkVendor.href = activeEndpoint + 'live-atlas/assets/vendor.d0ab50b1.js';
                    document.head.appendChild(linkVendor);

                    // Запуск приложения LiveAtlas
                    const script = document.createElement('script');
                    script.type = 'module';
                    script.crossOrigin = 'anonymous';
                    script.src = activeEndpoint + 'live-atlas/assets/index.a82d2095.js';
                    document.body.appendChild(script);
                }

                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', startLiveAtlas);
                } else {
                    startLiveAtlas();
                }

                window.addEventListener('load', () => {
                    setTimeout(() => {
                        if (!window.liveAtlasLoaded) {
                            const errBox = document.getElementById('splash__error');
                            const errMsg = document.getElementById('splash__error-message');
                            const spinner = document.getElementById('splash__spinner');
                            if (errBox && errMsg) {
                                errBox.setAttribute('aria-hidden', 'false');
                                errMsg.innerText = 'Не удалось загрузить компоненты карты. Проверьте соединение с интернетом.';
                            }
                            if (spinner) spinner.style.visibility = 'hidden';
                        }
                    }, 6000);
                });
            })();
