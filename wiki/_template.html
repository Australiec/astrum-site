<!doctype html>
<html lang="ru-RU" data-sky="night">
    <head>
        <meta charset="utf-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{TITLE}}</title>
        <meta name="description" content="{{DESC}}" />
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
        <meta name="theme-color" content="#010101" />
        <meta name="color-scheme" content="dark light" />
        <link rel="canonical" href="{{CANON}}" />
        <meta property="og:type" content="article" />
        <meta property="og:site_name" content="ASTRUM" />
        <meta property="og:locale" content="ru_RU" />
        <meta property="og:title" content="{{TITLE}}" />
        <meta property="og:description" content="{{DESC}}" />
        <meta property="og:url" content="{{CANON}}" />
        <meta property="og:image" content="{{OGIMG}}" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{TITLE}}" />
        <meta name="twitter:description" content="{{DESC}}" />
        <meta name="twitter:image" content="{{OGIMG}}" />
        <link rel="icon" href="{{UP}}favicon.ico?v=20261106-2" sizes="16x16 32x32 48x48 64x64" />
        <link rel="icon" href="{{UP}}assets/logo.webp?v=20261106-2" type="image/webp" />
        <link rel="apple-touch-icon" href="{{UP}}assets/apple-touch-icon.png?v=20261106-2" />
        <script type="application/ld+json">
            {{JSONLD}}
        </script>
        <link rel="stylesheet" href="{{UP}}assets/fonts/cartoon.css" />
        <script>
            (function () {
                var s = null;
                try {
                    s = localStorage.getItem("astrum-sky");
                } catch (e) {}
                if (s !== "night" && s !== "day") {
                    s = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "day" : "night";
                }
                document.documentElement.dataset.sky = s;
                var tc = document.querySelector('meta[name="theme-color"]');
                if (tc) tc.content = s === "night" ? "#010101" : "#fff7fd";
            })();
        </script>
        <style>
            :root {
                color-scheme: light;
                --bg: #fff7fd;
                --panel: #fff;
                --ink: #2b1c31;
                --muted: #78667d;
                --line: #2b1c311a;
                --soft: #2b1c310a;
                --glass: #fff7fd;
                --coral: #b91b9f;
                --grad: #b91b9f;
                --code: #f5e8f5;
                --shadow: 0 18px 50px -18px rgba(55, 24, 62, 0.25);
                --ease: cubic-bezier(0.16, 1, 0.3, 1);
            }
            html[data-sky="night"] {
                color-scheme: dark;
                --bg: #010101;
                --panel: #121212;
                --ink: #f8f1f8;
                --muted: #ababab;
                --line: #ffffff1c;
                --soft: #ffffff0d;
                --glass: #010101;
                --coral: #f071db;
                --grad: #f071db;
                --code: #1e1e1e;
            }
            * {
                box-sizing: border-box;
                margin: 0;
            }
            html {
                scroll-behavior: smooth;
                overflow-x: clip;
                scroll-padding-top: 90px;
            }
            body {
                font-family:
                    Onest,
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
                color: var(--ink);
                background: var(--bg);
                line-height: 1.7;
                font-size: 17px;
            }
            h1,
            h2,
            h3,
            h4 {
                font-family: Rubik, system-ui, sans-serif;
                font-weight: 900;
                letter-spacing: -0.02em;
                line-height: 1.1;
            }
            a {
                color: inherit;
            }
            button {
                font-family: inherit;
            }

            .shell {
                display: grid;
                grid-template-columns: 280px minmax(0, 1fr) 230px;
                gap: 56px;
                max-width: 1500px;
                margin: auto;
                padding: 66px 28px 0;
            }
            aside.nav {
                position: sticky;
                top: 66px;
                align-self: start;
                height: calc(100vh - 66px);
                overflow: auto;
                padding: 30px 6px 40px 0;
            }
            .search {
                position: relative;
                margin-bottom: 28px;
            }
            .search input {
                width: 100%;
                height: 46px;
                border-radius: 12px;
                border: 1px solid var(--line);
                background: var(--panel);
                padding: 0 44px 0 42px;
                font: inherit;
                font-size: 15px;
                color: var(--ink);
                outline: 0;
            }
            .search input:focus {
                border-color: var(--coral);
                box-shadow: 0 0 0 4px #c354b726;
            }
            .search svg {
                position: absolute;
                left: 14px;
                top: 13px;
                width: 19px;
                height: 19px;
                stroke: var(--muted);
                fill: none;
                stroke-width: 1.8;
                stroke-linecap: round;
            }
            .search kbd {
                position: absolute;
                right: 12px;
                top: 11px;
                font:
                    600 12px Onest,
                    sans-serif;
                color: var(--muted);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 2px 8px;
            }
            .results {
                position: absolute;
                left: 0;
                right: 0;
                top: 54px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 12px;
                box-shadow: var(--shadow);
                overflow: hidden;
                display: none;
                z-index: 5;
            }
            .results.on {
                display: block;
            }
            .results a {
                display: block;
                padding: 12px 16px;
                text-decoration: none;
                border-bottom: 1px solid var(--line);
            }
            .results a:last-child {
                border: 0;
            }
            .results a:hover,
            .results a.sel {
                background: var(--soft);
            }
            .results b {
                display: block;
                font-size: 15px;
            }
            .results small {
                color: var(--muted);
                font-size: 13px;
                display: block;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .results mark {
                background: #c354b740;
                color: inherit;
                border-radius: 12px;
            }
            .results .none {
                padding: 16px;
                color: var(--muted);
                font-size: 14.5px;
            }
            .grp {
                font-size: 11.5px;
                font-weight: 600;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--muted);
                margin: 26px 0 10px 14px;
            }
            .grp:first-of-type {
                margin-top: 0;
            }
            .item {
                display: block;
                padding: 10px 14px;
                border-radius: 12px;
                text-decoration: none;
                font-size: 15.5px;
                font-weight: 600;
                color: var(--muted);
                transition:
                    color 0.2s,
                    background 0.2s;
                position: relative;
            }
            .item:hover {
                color: var(--ink);
                background: var(--soft);
            }
            .item.on {
                color: var(--ink);
                background: var(--panel);
                box-shadow: 0 1px 0 var(--line);
            }
            .item.on::before {
                content: "";
                position: absolute;
                left: -1px;
                top: 12px;
                bottom: 12px;
                width: 3px;
                border-radius: 12px;
                background: var(--grad);
            }

            main {
                padding: 52px 0 100px;
                min-width: 0;
            }
            .cover {
                border-radius: 24px;
                overflow: hidden;
                aspect-ratio: 21/8;
                margin-bottom: 42px;
                box-shadow: var(--shadow);
                background: var(--soft);
            }
            .cover img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .eyebrow {
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--coral);
            }
            main h1 {
                font-size: clamp(38px, 5vw, 64px);
                margin: 12px 0 32px;
                line-height: 1.02;
            }
            .prose {
                max-width: 760px;
            }
            .prose > * + * {
                margin-top: 1.1em;
            }
            .prose h2 {
                font-size: clamp(26px, 2.8vw, 34px);
                font-weight: 700;
                margin-top: 2.2em;
                padding-top: 1.2em;
                border-top: 1px solid var(--line);
            }
            .prose h2:first-child {
                margin-top: 0;
                border: 0;
                padding: 0;
            }
            .prose h3 {
                font-size: 21px;
                font-weight: 700;
                margin-top: 1.8em;
            }
            .prose h4 {
                font-size: 17px;
                font-weight: 700;
                margin-top: 1.6em;
            }
            .prose h2 + *,
            .prose h3 + * {
                margin-top: 0.8em;
            }
            .prose :is(h2, h3):hover .anc {
                opacity: 1;
            }
            .anc {
                opacity: 0;
                margin-left: 10px;
                color: var(--coral);
                text-decoration: none;
                font-weight: 400;
                transition: opacity 0.2s;
            }
            .prose p,
            .prose li {
                color: color-mix(in srgb, var(--ink) 86%, var(--bg));
            }
            .prose ul,
            .prose ol {
                padding-left: 1.3em;
            }
            .prose li {
                padding-left: 0.3em;
            }
            .prose li + li {
                margin-top: 0.5em;
            }
            .prose li::marker {
                color: var(--coral);
            }
            .prose strong {
                color: var(--ink);
                font-weight: 600;
            }
            .prose a {
                color: var(--ink);
                text-decoration: none;
                border-bottom: 1.5px solid var(--coral);
            }
            .prose a:hover {
                color: var(--coral);
            }
            .prose code {
                font:
                    600 0.88em ui-monospace,
                    Consolas,
                    monospace;
                background: var(--code);
                padding: 0.18em 0.5em;
                border-radius: 12px;
                white-space: nowrap;
            }
            .prose img {
                max-width: 100%;
                height: auto;
                border-radius: 12px;
                border: 1px solid var(--line);
                cursor: zoom-in;
                display: block;
                margin-top: 1.4em;
                background: var(--soft);
            }
            .prose img + img {
                margin-top: 0.8em;
            }
            .prose blockquote {
                border-radius: 12px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-left: 4px solid var(--coral);
                padding: 18px 22px;
            }
            .prose blockquote p {
                margin: 0;
            }
            .prose .tw {
                overflow-x: auto;
                border: 1px solid var(--line);
                border-radius: 12px;
                background: var(--panel);
            }
            .prose table {
                border-collapse: collapse;
                width: 100%;
                font-size: 15px;
                min-width: 520px;
            }
            .prose th {
                text-align: left;
                font-weight: 600;
                font-size: 12.5px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--muted);
                padding: 14px 18px;
                border-bottom: 1px solid var(--line);
                white-space: nowrap;
            }
            .prose td {
                padding: 13px 18px;
                border-bottom: 1px solid var(--line);
                vertical-align: top;
            }
            .prose tr:last-child td {
                border: 0;
            }
            .prose td:first-child {
                font-weight: 600;
                color: var(--ink);
            }
            .prose .btn {
                display: inline-flex;
                align-items: center;
                height: 50px;
                padding: 0 26px;
                border-radius: 12px;
                border: 0;
                background: var(--grad);
                color: #fff;
                font-weight: 600;
                font-size: 15.5px;
                margin: 6px 10px 0 0;
                box-shadow: none;
            }
            .prose .btn:hover {
                color: #fff;
                background: #8b117a;
            }
            .prose .btn.ghost {
                background: transparent;
                color: var(--ink);
                box-shadow: inset 0 0 0 1.5px var(--ink);
            }
            .prose .btn.ghost:hover {
                background: var(--ink);
                color: var(--bg);
            }

            .pn {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
                margin-top: 70px;
                max-width: 760px;
            }
            .pn a {
                padding: 22px 26px;
                border-radius: 12px;
                border: 1px solid var(--line);
                background: var(--panel);
                text-decoration: none;
                transition:
                    border-color 0.3s,
                    transform 0.3s var(--ease);
            }
            .pn a:hover {
                transform: translateY(-3px);
                border-color: var(--coral);
            }
            .pn small {
                display: block;
                color: var(--muted);
                font-size: 12px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                font-weight: 600;
            }
            .pn b {
                font-family: Rubik, sans-serif;
                font-size: 18px;
                display: block;
                margin-top: 8px;
            }
            .pn .nx {
                text-align: right;
                grid-column: 2;
            }

            aside.toc {
                position: sticky;
                top: 66px;
                align-self: start;
                padding: 52px 0 40px;
                max-height: calc(100vh - 66px);
                overflow: auto;
            }
            .toc h2 {
                font-size: 11.5px;
                font-weight: 600;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: 14px;
                font-family: Onest, sans-serif;
                line-height: 1.2;
            }
            .toc a {
                display: block;
                padding: 6px 0 6px 16px;
                border-left: 1px solid var(--line);
                font-size: 14px;
                color: var(--muted);
                text-decoration: none;
                line-height: 1.4;
            }
            .toc a.l3 {
                padding-left: 30px;
                font-size: 13.5px;
            }
            .toc a:hover {
                color: var(--ink);
            }
            .toc a.on {
                color: var(--ink);
                border-left-color: var(--coral);
                font-weight: 600;
            }

            .lb {
                position: fixed;
                inset: 0;
                z-index: 100;
                background: rgba(15, 10, 20, 0.92);
                display: none;
                place-items: center;
                padding: 30px;
                cursor: zoom-out;
            }
            .lb.on {
                display: grid;
            }
            .lb img {
                max-width: 100%;
                max-height: 90vh;
                border-radius: 12px;
            }

            .wiki-menu-btn {
                display: none;
                align-items: center;
                gap: 10px;
                margin-bottom: 22px;
                padding: 10px 16px;
                border-radius: 12px;
                border: 1px solid var(--line);
                background: var(--panel);
                color: var(--ink);
                font-size: 14.5px;
                font-weight: 600;
                cursor: pointer;
                transition:
                    border-color 0.2s,
                    background 0.2s;
            }
            .wiki-menu-btn:hover {
                border-color: var(--coral);
            }
            .wiki-menu-btn svg {
                width: 18px;
                height: 18px;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.8;
                stroke-linecap: round;
            }

            @media (max-width: 1180px) {
                .shell {
                    grid-template-columns: 260px minmax(0, 1fr);
                    gap: 40px;
                }
                aside.toc {
                    display: none;
                }
            }
            @media (max-width: 860px) {
                .shell {
                    grid-template-columns: 1fr;
                    padding: 66px 20px 0;
                }
                .wiki-menu-btn {
                    display: inline-flex;
                }
                aside.nav {
                    position: fixed;
                    inset: 66px 0 0 0;
                    z-index: 35;
                    background: var(--bg);
                    height: auto;
                    padding: 24px 20px;
                    transform: translateX(-100%);
                    transition: transform 0.35s var(--ease);
                    visibility: hidden;
                }
                .open aside.nav {
                    transform: none;
                    visibility: visible;
                }
                main {
                    padding-top: 28px;
                }
                .cover {
                    aspect-ratio: 16/8;
                    border-radius: 12px;
                }
                .pn {
                    grid-template-columns: 1fr;
                }
                .pn .nx {
                    grid-column: 1;
                }
            }
        </style>
        <link rel="stylesheet" href="{{UP}}assets/site-header.css" />
        <link rel="stylesheet" href="{{UP}}assets/brand-palette.css" />
    </head>
    <body>

                <ul class="nav-links" id="main-menu">

        <div class="lb" id="lb"><img alt="" /></div>
        <script src="{{UP}}assets/site-header.js" defer></script>
        <script>
            const W = "{{W}}",
                $ = s => document.querySelector(s);
            /* разделы вики на мобильных и просмотр картинок */
            const menuBtn = $("#menu");
            const setDrawer = open => {
                document.body.classList.toggle("open", open);
                if (menuBtn) menuBtn.setAttribute("aria-expanded", String(open));
                if (open && document.body.classList.contains("menu-open")) {
                    document.body.classList.remove("menu-open");
                    const b = $(".burger");
                    if (b) {
                        b.setAttribute("aria-expanded", "false");
                        b.setAttribute("aria-label", "Открыть меню");
                    }
                }
            };
            if (menuBtn) menuBtn.onclick = () => setDrawer(!document.body.classList.contains("open"));
            document.querySelectorAll("#nav a").forEach(a => a.addEventListener("click", () => setDrawer(false)));
            document.querySelectorAll(".prose img").forEach(
                i =>
                    (i.onclick = () => {
                        $("#lb img").src = i.src;
                        $("#lb").classList.add("on");
                    }),
            );
            $("#lb").onclick = () => $("#lb").classList.remove("on");
            /* подсветка текущего раздела в оглавлении */
            const hs = [...document.querySelectorAll(".prose h2,.prose h3")],
                tl = [...document.querySelectorAll("#toc a")];
            if (tl.length)
                addEventListener(
                    "scroll",
                    () => {
                        let c = null;
                        hs.forEach(h => {
                            if (h.getBoundingClientRect().top < 140) c = h.id;
                        });
                        tl.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + c));
                    },
                    { passive: true },
                );
            /* поиск: индекс подгружается при первом фокусе */
            let IDX = null,
                P = null,
                sel = -1;
            const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
            const url = s => (s === "info" ? W || "./" : W + s + "/");
            const q = $("#q"),
                box = $("#res");
            const load = () =>
                P ||
                (P = fetch(W + "search.json")
                    .then(r => r.json())
                    .then(j => (IDX = j))
                    .catch(() => (IDX = [])));
            q.addEventListener("focus", load);
            q.addEventListener("input", async () => {
                const v = q.value.trim().toLowerCase();
                if (!v) {
                    box.classList.remove("on");
                    return;
                }
                await load();
                const out = [];
                IDX.forEach(p => {
                    const ti = p.t.toLowerCase().includes(v),
                        i = p.x.toLowerCase().indexOf(v);
                    if (ti || i > -1)
                        out.push({ p, snip: i > -1 ? p.x.slice(Math.max(0, i - 30), i + 80) : "", rank: ti ? 0 : 1 });
                });
                out.sort((a, b) => a.rank - b.rank);
                sel = -1;
                const re = new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"),
                    hl = s => esc(s).replace(re, m => `<mark>${m}</mark>`);
                box.innerHTML = out.length
                    ? out
                          .slice(0, 7)
                          .map(o => `<a href="${url(o.p.s)}"><b>${hl(o.p.t)}</b><small>${hl(o.snip)}</small></a>`)
                          .join("")
                    : '<div class="none">Ничего не найдено</div>';
                box.classList.add("on");
            });
            q.addEventListener("keydown", e => {
                const a = [...box.querySelectorAll("a")];
                if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                    e.preventDefault();
                    sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + a.length) % a.length;
                    a.forEach((x, i) => x.classList.toggle("sel", i === sel));
                }
                if (e.key === "Enter" && a.length) (a[sel] || a[0]).click();
                if (e.key === "Escape") {
                    box.classList.remove("on");
                    q.blur();
                }
            });
            document.addEventListener("click", e => {
                if (!e.target.closest(".search")) box.classList.remove("on");
            });
            addEventListener("keydown", e => {
                if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
                    e.preventDefault();
                    q.focus();
                }
                if (e.key === "Escape") {
                    $("#lb").classList.remove("on");
                    if (document.body.classList.contains("open")) setDrawer(false);
                }
            });
        </script>
